name: surprise-signs-digitizer
services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    volumes:
      - ./data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 900m
  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      OCR_MODEL: ${OCR_MODEL:-PP-OCRv5}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    volumes:
      - ./data:/data
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 5500m
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
volumes:
  caddy-data:
  caddy-config:
